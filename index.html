<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Larder</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='4' y='3' width='20' height='22' rx='3' fill='none' stroke='%23c9683b' stroke-width='2'/%3E%3Cline x1='4' y1='12' x2='24' y2='12' stroke='%23c9683b' stroke-width='2'/%3E%3Cline x1='4' y1='19' x2='24' y2='19' stroke='%23c9683b' stroke-width='2'/%3E%3Ccircle cx='14' cy='7.5' r='1.3' fill='%23c9683b'/%3E%3Ccircle cx='14' cy='15.5' r='1.3' fill='%23c9683b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="4" y="3" width="20" height="22" rx="3" stroke="currentColor" stroke-width="2" />
        <line x1="4" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="2" />
        <line x1="4" y1="19" x2="24" y2="19" stroke="currentColor" stroke-width="2" />
        <circle cx="14" cy="7.5" r="1.3" fill="currentColor" />
        <circle cx="14" cy="15.5" r="1.3" fill="currentColor" />
      </svg>
      Larder
    </h1>
    <nav class="tabs">
      <button class="tab-btn active" data-view="recipes">Recipes</button>
      <button class="tab-btn" data-view="shopping">Shopping List <span id="shopping-count" class="badge hidden">0</span></button>
    </nav>
  </header>

  <main id="app"></main>

  <!-- Recipe add/edit modal -->
  <dialog id="recipe-modal">
    <form id="recipe-form" method="dialog">
      <h2 id="modal-title">New Recipe</h2>
      <input type="hidden" id="recipe-id" />

      <label>
        Title
        <div class="input-with-mic">
          <input type="text" id="f-title" required placeholder="e.g. Lemon Garlic Pasta" />
          <button type="button" class="mic-btn" id="title-mic-btn" title="Dictate title">🎤</button>
        </div>
      </label>

      <div class="import-row">
        <button type="button" id="scan-photo-btn" class="btn small ghost">📷 Scan a photo</button>
        <span class="hint">Sends recognised text to Ingredients or Steps</span>
        <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
      </div>
      <div id="ocr-status" class="hint hidden"></div>
      <ul id="ocr-results" class="ocr-results hidden"></ul>

      <div class="row">
        <label>
          Servings
          <input type="number" id="f-servings" min="1" value="4" />
        </label>
        <label>
          Tags <span class="hint">(comma separated)</span>
          <input type="text" id="f-tags" placeholder="dinner, vegetarian, italian" />
        </label>
      </div>

      <div class="ingredients-field">
        <div class="label-row">
          <span class="field-label">Ingredients</span>
          <span class="hint">Separate boxes keep totals accurate</span>
        </div>
        <div class="ingredient-col-headers">
          <span>Qty</span>
          <span>Unit</span>
          <span>Ingredient</span>
          <span></span>
        </div>
        <div id="ingredient-rows"></div>
        <div class="ingredient-tools">
          <button type="button" id="add-ingredient-btn" class="btn small ghost">+ Add ingredient</button>
          <button type="button" id="voice-ingredient-btn" class="btn small ghost">🎤 Add by voice</button>
        </div>
      </div>

      <div class="field-block">
        <div class="label-row">
          <label for="f-steps" class="field-label">Steps <span class="hint">(one per line)</span></label>
          <button type="button" id="steps-mic-btn" class="btn small ghost mic-toggle">🎤 Dictate</button>
        </div>
        <textarea id="f-steps" rows="6" required placeholder="Preheat oven to 350F&#10;Mix dry ingredients&#10;Bake for 25 minutes"></textarea>
      </div>

      <label>
        Notes <span class="hint">(optional)</span>
        <textarea id="f-notes" rows="2" placeholder="Anything else worth remembering"></textarea>
      </label>

      <div class="modal-actions">
        <button type="button" id="cancel-btn" class="btn ghost">Cancel</button>
        <button type="submit" id="save-btn" class="btn primary">Save Recipe</button>
      </div>
    </form>
  </dialog>

  <template id="ingredient-row-template">
    <div class="ingredient-row">
      <input type="text" class="ing-qty" inputmode="decimal" placeholder="1 1/2" />
      <select class="ing-unit">
        <option value="">no unit</option>
        <optgroup label="Weight">
          <option value="g">g</option>
          <option value="kg">kg</option>
          <option value="oz">oz</option>
          <option value="lb">lb</option>
        </optgroup>
        <optgroup label="Volume">
          <option value="ml">ml</option>
          <option value="l">l</option>
          <option value="tsp">tsp</option>
          <option value="dsp">dsp</option>
          <option value="tbsp">tbsp</option>
          <option value="fl oz">fl oz</option>
          <option value="pint">pint</option>
          <option value="cup">cup</option>
        </optgroup>
        <optgroup label="Other">
          <option value="clove">clove</option>
          <option value="slice">slice</option>
          <option value="rasher">rasher</option>
          <option value="piece">piece</option>
          <option value="sprig">sprig</option>
          <option value="bunch">bunch</option>
          <option value="stick">stick</option>
          <option value="can">can</option>
          <option value="jar">jar</option>
          <option value="packet">packet</option>
          <option value="whole">whole</option>
        </optgroup>
      </select>
      <input type="text" class="ing-name" placeholder="flour" required />
      <button type="button" class="remove-row-btn" title="Remove ingredient">✕</button>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
